<script>
/* =========================================================
   VIEW HELPERS + DEPENDENCY ENGINE
   ========================================================= */
function stopEditing(){ editing.id=null; editing.kind=null; editing.draft=""; }

function allTasks(proj){
  return [...proj.active, ...proj.paused, ...proj.done_today, ...proj.done_week];
}

function allTasksIndexAllProjects(){
  const map = new Map();
  for(const pid of Object.keys(state.data.projects)){
    const proj = state.data.projects[pid];
    for(const t of allTasks(proj)){
      map.set(taskKey(t), t);
    }
  }
  return map;
}

function listForViewSingleProject(proj){
  if(state.view==="active") return proj.active;
  if(state.view==="paused") return proj.paused;
  if(state.view==="done"){
    return (state.doneFilter==="today") ? proj.done_today : proj.done_week;
  }
  return proj.active;
}

function listForViewAllProjects(){
  const out = [];
  for(const pid of state.data.projectOrder){
    const proj = getProject(pid);
    if(!proj) continue;
    const arr = listForViewSingleProject(proj);
    for(const t of arr) out.push(t);
  }
  return out;
}

function currentList(){
  ensureCurrentProject();
  if(state.projectId === ALL_ID){
    return listForViewAllProjects();
  }
  return listForViewSingleProject(currentProject());
}

function doneKeySetForProject(proj){
  const s = new Set();
  for(const x of proj.done_today) s.add(taskKey(x));
  for(const x of proj.done_week) s.add(taskKey(x));
  return s;
}

function blockersForTaskKey(task){
  const deps = Array.isArray(task.dependsOn) ? task.dependsOn : [];
  if(!deps.length) return [];
  const idx = allTasksIndexAllProjects();

  const blockers = [];
  for(const depKey of deps){
    const dep = idx.get(depKey);
    if(!dep) continue; // ignore dangling deps
    const depProj = getProject(dep.projectId);
    const doneSet = depProj ? doneKeySetForProject(depProj) : new Set();
    if(!doneSet.has(depKey)) blockers.push(depKey);
  }
  return blockers;
}
function isBlocked(task){
  return blockersForTaskKey(task).length>0;
}

function enforceDependenciesForProject(proj){
  for(const item of [...proj.active]){
    if(!item.dependsOn || item.dependsOn.length===0) continue;
    if(isBlocked(item)){
      const i = proj.active.findIndex(x=>x.id===item.id);
      if(i>=0){
        const [m] = proj.active.splice(i,1);
        proj.paused.push(m);
      }
    }
  }
  for(const item of [...proj.paused]){
    if(!item.dependsOn || item.dependsOn.length===0) continue;
    if(!isBlocked(item)){
      const i = proj.paused.findIndex(x=>x.id===item.id);
      if(i>=0){
        const [m] = proj.paused.splice(i,1);
        proj.active.push(m);
      }
    }
  }
}
function enforceDependenciesAllProjects(){
  for(const pid of Object.keys(state.data.projects)){
    enforceDependenciesForProject(state.data.projects[pid]);
  }
}
</script>

<script>
/* =========================================================
   LINK MODAL + MOVE TASK FLOW
   ========================================================= */
const linkOverlay = $("linkOverlay");
const linkList = $("linkList");
const linkTitle = $("linkTitle");
const linkSub = $("linkSub");

let linkBaseKey = null;
let linkBaseTask = null;

function canLinkAcrossProjects(){
  return state.projectId === ALL_ID;
}

function getTaskByKey(key){
  const idx = allTasksIndexAllProjects();
  return idx.get(String(key)) || null;
}

function openLinkModalForTask(task){
  linkBaseTask = task;
  linkBaseKey = taskKey(task);

  linkTitle.textContent = "Dependencies";
  linkSub.textContent = `Select tasks that must wait for: ${task.text}`;

  renderMoveProjectSelect(task.projectId);

  const candidates = [];
  if(canLinkAcrossProjects()){
    for(const pid of state.data.projectOrder){
      const proj = getProject(pid);
      if(!proj) continue;
      for(const t of [...proj.active, ...proj.paused]){
        if(taskKey(t) !== linkBaseKey) candidates.push(t);
      }
    }
  }else{
    const proj = getProject(task.projectId);
    for(const t of [...proj.active, ...proj.paused]){
      if(taskKey(t) !== linkBaseKey) candidates.push(t);
    }
  }

  linkList.innerHTML = "";
  candidates.forEach(it=>{
    const itKey = taskKey(it);
    const checked = (it.dependsOn || []).includes(linkBaseKey);
    const disabled = wouldCreateCycleKeys(linkBaseKey, itKey);

    const row = document.createElement("div");
    row.className = "modalRow" + (disabled ? " disabled" : "");

    const label = document.createElement("label");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked;
    cb.disabled = disabled;

    const body = document.createElement("div");
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = it.text || "(untitled)";
    const m = document.createElement("div");
    m.className = "m";
    if(disabled) m.textContent = "Not allowed (would create a cycle)";
    else m.textContent = checked ? "Will be paused until this is done" : "Not dependent";

    body.appendChild(t);
    body.appendChild(m);

    label.appendChild(cb);
    label.appendChild(body);

    row.appendChild(label);
    row.dataset.key = itKey;
    linkList.appendChild(row);
  });

  linkOverlay.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeLinkModal(){
  linkOverlay.classList.remove("on");
  document.body.style.overflow = "";
  linkBaseKey = null;
  linkBaseTask = null;
}
linkOverlay.addEventListener("click",(e)=>{ if(e.target===linkOverlay) closeLinkModal(); });
$("linkCancel").onclick = closeLinkModal;

function renderMoveProjectSelect(currentPid){
  const sel = $("moveProjectSelect");
  sel.innerHTML = "";
  for(const pid of state.data.projectOrder){
    const p = getProject(pid);
    if(!p) continue;
    const opt = document.createElement("option");
    opt.value = pid;
    opt.textContent = `${p.name}${pid===currentPid ? " (Current)" : ""}`;
    sel.appendChild(opt);
  }
  sel.value = currentPid;
}

function moveTaskToProject(task, targetPid){
  if(!task || !targetPid) return;
  const fromPid = task.projectId;
  if(fromPid === targetPid) return;

  const from = getProject(fromPid);
  const to = getProject(targetPid);
  if(!from || !to) return;

    // FIX: Remove from ALL lists to handle done_today/done_week duplicates
  for(const listKey of ["active", "paused", "done_today", "done_week"]){
    from[listKey] = from[listKey].filter(x => x.id !== task.id);
  }


  task.projectId = targetPid;

  if(state.projectId !== ALL_ID){
    task.dependsOn = (task.dependsOn||[]).filter(k => parseTaskKey(k).projectId === targetPid);
  }

  const oldKey = `${fromPid}:${task.id}`;
  const newKey = `${targetPid}:${task.id}`;

  for(const proj of Object.values(state.data.projects)){
    for(const t of allTasks(proj)){
      if(Array.isArray(t.dependsOn) && t.dependsOn.includes(oldKey)){
        t.dependsOn = t.dependsOn.map(k => k===oldKey ? newKey : k);
      }
    }
  }

  if(task.doneAt){
    to.done_today.push({...task});
    to.done_week.push({...task});
  }else{
    to.active.push({...task});
  }

  enforceDependenciesAllProjects();
  queueSave();
  renderAll();
}

$("moveProjectBtn").onclick = ()=>{
  if(!linkBaseTask) return;
  const targetPid = $("moveProjectSelect").value;
  moveTaskToProject(linkBaseTask, targetPid);
  closeLinkModal();
};

/* cycle prevention */
function allKeysIndex(){
  return allTasksIndexAllProjects();
}
function hasPathDependsOnKeys(startKey, targetKey){
  const map = allKeysIndex();
  const seen = new Set();
  const stack = [startKey];
  while(stack.length){
    const cur = stack.pop();
    if(cur === targetKey) return true;
    if(seen.has(cur)) continue;
    seen.add(cur);
    const node = map.get(cur);
    const deps = Array.isArray(node?.dependsOn) ? node.dependsOn : [];
    for(const d of deps){
      if(d && !seen.has(d)) stack.push(d);
    }
  }
  return false;
}
function wouldCreateCycleKeys(baseKey, candidateKey){
  return hasPathDependsOnKeys(baseKey, candidateKey);
}

/* apply link changes */
$("linkApply").onclick = ()=>{
  if(!linkBaseKey) return;

  const rows = [...linkList.querySelectorAll(".modalRow")];
  const idx = allKeysIndex();

  for(const r of rows){
    const key = r.dataset.key;
    const cb = r.querySelector("input[type=checkbox]");
    if(!cb || cb.disabled) continue;

    const item = idx.get(key);
    if(!item) continue;

    const deps = Array.isArray(item.dependsOn) ? item.dependsOn.filter(Boolean).map(String) : [];
    const has = deps.includes(linkBaseKey);

    if(cb.checked && !has) deps.push(linkBaseKey);
    if(!cb.checked && has) item.dependsOn = deps.filter(x=>x!==linkBaseKey);
    else item.dependsOn = deps;

    if(state.projectId !== ALL_ID){
      item.dependsOn = item.dependsOn.filter(k => parseTaskKey(k).projectId === item.projectId);
    }
  }

  enforceDependenciesAllProjects();
  queueSave();
  renderAll();
  closeLinkModal();
};

/* unlink ops */
function childrenOfKey(baseKey){
  const out = [];
  const idx = allKeysIndex();
  for(const t of idx.values()){
    if(Array.isArray(t.dependsOn) && t.dependsOn.includes(baseKey)) out.push(t);
  }
  return out;
}
function unlinkDownstream(baseKey){
  for(const child of childrenOfKey(baseKey)){
    child.dependsOn = (child.dependsOn||[]).filter(x=>x!==baseKey);
  }
}
function unlinkUpstream(baseKey){
  const base = getTaskByKey(baseKey);
  if(base) base.dependsOn = [];
}
function unlinkAll(baseKey){
  unlinkUpstream(baseKey);
  unlinkDownstream(baseKey);
}
function removeButPreserveChain(baseKey){
  const base = getTaskByKey(baseKey);
  if(!base) return;

  const parents = Array.isArray(base.dependsOn) ? base.dependsOn.filter(Boolean).map(String) : [];
  const kids = childrenOfKey(baseKey);

  for(const child of kids){
    let deps = Array.isArray(child.dependsOn) ? child.dependsOn.filter(Boolean).map(String) : [];
    deps = deps.filter(x=>x!==baseKey);

    for(const p of parents){
      if(!p) continue;
      if(deps.includes(p)) continue;
      if(wouldCreateCycleKeys(p, taskKey(child))) continue;
      deps.push(p);
    }
    child.dependsOn = deps;
    if(state.projectId !== ALL_ID){
      child.dependsOn = child.dependsOn.filter(k => parseTaskKey(k).projectId === child.projectId);
    }
  }

  base.dependsOn = [];
}

$("unlinkBtn").onclick = ()=>{
  if(!linkBaseKey) return;
  const mode = $("unlinkMode").value || "downstream";
  const baseKey = linkBaseKey;

  const label = ({
    downstream: "unlink downstream dependencies",
    upstream: "unlink upstream dependencies",
    all: "unlink all dependencies",
    preserve: "remove but preserve chain"
  })[mode] || mode;

  if(!confirm(`This will ${label} for this task.\nThis cannot be undone. Continue?`)) return;

  if(mode==="downstream") unlinkDownstream(baseKey);
  else if(mode==="upstream") unlinkUpstream(baseKey);
  else if(mode==="all") unlinkAll(baseKey);
  else if(mode==="preserve") removeButPreserveChain(baseKey);

  enforceDependenciesAllProjects();
  queueSave();
  renderAll();
  closeLinkModal();
};

/* notes (focus-only) */
let focusNotesTaskKey = null;
function showFocusNotesForTask(task){
  const boxWrap = $("focusNotes");
  const box = $("focusNotesBox");
  if(!task){
    boxWrap.style.display = "none";
    box.value = "";
    focusNotesTaskKey = null;
    return;
  }
  const tKey = taskKey(task);
  focusNotesTaskKey = tKey;
  boxWrap.style.display = "";
  box.value = task.notes || "";
  // Use a single handler that checks the current task key
  box.onblur = ()=>{
    // Only save if this is still the same task we're editing
    if(focusNotesTaskKey !== tKey) return;
    const currentTask = getTaskByKey(tKey);
    if(!currentTask) return;
    const v = String(box.value || "");
    if(currentTask.notes !== v){
      currentTask.notes = v;
      queueSave();
    }
  };
}

/* =========================================================
   PAGE / VIEW
   ========================================================= */
function setDoneFilter(which){
  state.doneFilter = which;
  qsa(".doneBtn").forEach(b=>b.classList.toggle("active", b.dataset.done===which));
  renderAll();
}
function setView(view){
  state.view = view;
  qsa(".summaryTab").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  stopEditing();
  renderAll();
}
function setPage(page){
  state.page = page;
  renderAll();
}
</script>

<script>
/* =========================================================
   DRAG REORDER
   ========================================================= */
function enableDragList(ul){
  ul.ondragover=(e)=>{
    e.preventDefault();
    const dragging=ul.querySelector(".dragging");
    if(!dragging) return;
    const after=getAfterElement(ul,e.clientY);
    after ? ul.insertBefore(dragging,after) : ul.appendChild(dragging);
  };
}
function getAfterElement(ul,y){
  const els=[...ul.querySelectorAll(".item:not(.dragging)")];
  return els.reduce((closest,el)=>{
    const box=el.getBoundingClientRect();
    const offset=y-box.top-box.height/2;
    if(offset<0 && offset>closest.offset) return {offset,el};
    return closest;
  },{offset:-Infinity,el:null}).el;
}
function syncOrderFromDOMList(){
  if(state.projectId === ALL_ID) return;

  const ul = $("list");
  const ids = [...ul.querySelectorAll(".item")].map(li=>li.dataset.id);

  const proj = currentProject();
  const listKey = (state.view==="active") ? "active"
               : (state.view==="paused")  ? "paused"
               : null;
  if(!listKey) return;

  const arr = proj[listKey];
  proj[listKey] = ids.map(id=>arr.find(x=>x.id===id)).filter(Boolean);
  queueSave();
  renderAll();
}

function enableDragProjects(container){
  container.ondragover=(e)=>{
    e.preventDefault();
    const dragging = container.querySelector(".tile.dragging");
    if(!dragging) return;
    const after = getAfterTile(container, e.clientY);
    after ? container.insertBefore(dragging, after) : container.appendChild(dragging);
  };
}
function getAfterTile(container, y){
  const els=[...container.querySelectorAll(".tile:not(.dragging)")];
  return els.reduce((closest,el)=>{
    const box=el.getBoundingClientRect();
    const offset=y-box.top-box.height/2;
    if(offset<0 && offset>closest.offset) return {offset,el};
    return closest;
  },{offset:-Infinity,el:null}).el;
}
function syncProjectOrderFromDOM(){
  const container = $("summaryGrid");
  if(!container) return;
  const ids = [...container.querySelectorAll(".tile")].map(t=>t.dataset.pid).filter(Boolean);
  state.data.projectOrder = ids.filter(pid=>state.data.projects[pid]);
  for(const pid of Object.keys(state.data.projects)){
    if(!state.data.projectOrder.includes(pid)) state.data.projectOrder.push(pid);
  }
  queueSave();
  renderAll();
}

/* =========================================================
   EDIT INPUT BUILDER
   ========================================================= */
function makeEditInput(value,{onEnter,onEscape,onBlur,placeholder,small}={}){
  const inp=document.createElement("input");
  inp.className="editInput"+(small?" small":"");
  inp.value=value ?? "";
  if(placeholder) inp.placeholder=placeholder;

  inp.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); onEnter?.(inp.value); }
    if(e.key==="Escape"){ e.preventDefault(); onEscape?.(); }
  });
  inp.addEventListener("blur",()=>onBlur?.(inp.value));
  setTimeout(()=>{ inp.focus(); inp.select(); },0);
  return inp;
}
function saveEstimate(task, raw){
  const s = String(raw??"").trim();
  if(!s){ task.estimateMins=0; queueSave(); syncTimerWithEstimate(task); return; }
  const n = Math.round(Number(s));
  if(!Number.isFinite(n) || n<0) return;
  task.estimateMins = n;
  queueSave();
  syncTimerWithEstimate(task);
}
function syncTimerWithEstimate(task){
  // If the timer is tracking this task, reset it to the new estimate
  const tKey = taskKey(task);
  if(timerTaskKey === tKey){
    resetTimerToEstimate(task.estimateMins, tKey);
    updateHeaderTimer();
    if(focusOverlay.classList.contains("on")) updateFocusTimerUI();
  }
}

/* =========================================================
   TASK HELPERS
   ========================================================= */
function findTaskInProject(proj, id){
  const keys = ["active","paused","done_today","done_week"];
  for(const k of keys){
    const idx = proj[k].findIndex(x=>x.id===id);
    if(idx!==-1) return { listKey:k, idx };
  }
  return null;
}
function updateTaskField(task, field, value){
  task[field] = value;
  queueSave();
}
function deleteTask(task){
  const proj = getProject(task.projectId);
  if(!proj) return;

  // Stop timer if it was tracking this task
  const deadKey = `${task.projectId}:${task.id}`;
  if(timerTaskKey === deadKey){
    stopTimer();
  }

  // FIX: Remove from ALL lists, not just the first found
  for(const listKey of ["active", "paused", "done_today", "done_week"]){
    proj[listKey] = proj[listKey].filter(x => x.id !== task.id);
  }

  // Clean up dependency references
  for(const p of Object.values(state.data.projects)){
    for(const t of allTasks(p)){
      if(Array.isArray(t.dependsOn) && t.dependsOn.includes(deadKey)){
        t.dependsOn = t.dependsOn.filter(x=>x!==deadKey);
      }
    }
  }

  enforceDependenciesAllProjects();
  stopEditing();
  queueSave();
  renderAll();
}

/* =========================================================
   CRUD ACTIONS
   ========================================================= */
function addItem(text){
  const t = (text||"").trim();
  if(!t) return;

  if(state.projectId === ALL_ID){
    alert("Add tasks inside a specific project (not ALL PROJECTS).");
    return;
  }

  const proj = currentProject();
  proj.active.push(normalizeTask({
    id: uid(),
    projectId: proj.id,
    text: t,
    createdAt: Date.now(),
    pausedReason: "",
    estimateMins: 0,
    doneAt: null,
    dependsOn: [],
    notes: ""
  }, proj.id));

  enforceDependenciesAllProjects();
  queueSave();
  renderAll();
}
function pauseWithReason(task){
  if(state.projectId === ALL_ID){
    alert("Pause/resume inside a specific project (not ALL PROJECTS).");
    return;
  }
  const proj = getProject(task.projectId);
  if(!proj) return;

  if(task.dependsOn?.length && isBlocked(task)){
    alert("This task is blocked by a dependency. Clear the dependency first.");
    return;
  }
  const reason = prompt("Pause reason / blocker (optional):", "");
  const loc = findTaskInProject(proj, task.id);
  if(!loc || loc.listKey!=="active") return;
  proj.active.splice(loc.idx,1);
  task.pausedReason = String(reason ?? "");
  proj.paused.push(task);

  stopEditing();
  saveNow({silent:true}).catch(()=>{});
  renderAll();
}
function resumeTask(task){
  if(state.projectId === ALL_ID){
    alert("Pause/resume inside a specific project (not ALL PROJECTS).");
    return;
  }
  const proj = getProject(task.projectId);
  if(!proj) return;

  if(task.dependsOn?.length && isBlocked(task)){
    alert("This task is blocked by a dependency.");
    return;
  }
  const loc = findTaskInProject(proj, task.id);
  if(!loc || loc.listKey!=="paused") return;
  proj.paused.splice(loc.idx,1);
  task.pausedReason = "";
  proj.active.push(task);

  enforceDependenciesAllProjects();
  stopEditing();
  saveNow({silent:true}).catch(()=>{});
  renderAll();
}
function markDone(task){
  stopTimer();

  if(state.projectId === ALL_ID){
    alert("Mark done inside a specific project (not ALL PROJECTS).");
    return;
  }

  const proj = getProject(task.projectId);
  if(!proj) return;

  // FIX: Remove from ALL lists first (handles any edge cases)
  for(const listKey of ["active", "paused", "done_today", "done_week"]){
    proj[listKey] = proj[listKey].filter(x => x.id !== task.id);
  }
  
  task.doneAt = Date.now();

  // Add to done buckets (these are separate copies for display purposes)
  proj.done_today.push({...task});
  proj.done_week.push({...task});

  enforceDependenciesAllProjects();
  stopEditing();
  saveNow({silent:true}).catch(()=>{});
  renderAll();
}
function restoreFromDone(task){
  if(state.projectId === ALL_ID){
    alert("Restore inside a specific project (not ALL PROJECTS).");
    return;
  }

  const proj = getProject(task.projectId);
  if(!proj) return;

  proj.done_today = proj.done_today.filter(x=>x.id!==task.id);
  proj.done_week  = proj.done_week.filter(x=>x.id!==task.id);

  task.doneAt = null;
  task.pausedReason = "";
  proj.active.push(task);

  enforceDependenciesAllProjects();
  stopEditing();
  saveNow({silent:true}).catch(()=>{});
  renderAll();
}
function clearDoneCurrent(){
  if(state.projectId === ALL_ID){
    alert("Clear done inside a specific project (not ALL PROJECTS).");
    return;
  }
  const proj = currentProject();
  if(state.doneFilter === "today") proj.done_today = [];
  else proj.done_week = [];
  queueSave();
  renderAll();
}

/* =========================================================
   UI HELPERS
   ========================================================= */
function minsToHm(mins){
  const m = Math.max(0, Math.round(mins||0));
  const h = Math.floor(m/60);
  const r = m % 60;
  if(h<=0) return `${r}m`;
  if(r===0) return `${h}h`;
  return `${h}h ${r}m`;
}
function renderListFooter(){
  let items = currentList();
  const total = items.reduce((acc,it)=>acc + (Number(it.estimateMins)||0), 0);
  const txt = `${items.length} task${items.length===1?"":"s"} (${minsToHm(total)})`;
  $("listFooter").textContent = txt;
  $("listFooter").style.display = (state.page==="list") ? "" : "none";
}

function blockersLabel(task){
  const blockers = blockersForTaskKey(task);
  if(!blockers.length) return null;
  const idx = allTasksIndexAllProjects();
  const names = blockers.map(k => idx.get(k)?.text || "(unknown)");
  const short = names.slice(0,2).join(", ") + (names.length>2 ? ` +${names.length-2}` : "");
  return `Depends on: ${short}`;
}

/* =========================================================
   RENDER ITEM
   ========================================================= */
let activeColorPicker = null; // Track open color picker

function renderItem(li, task, i, {showHandle=true, showNum=true, nested=false, isSubtask=false}={}){
  li.className = "item" + (nested ? " nested" : "") + (isSubtask ? " subtask" : "");
  const isPriority = (state.view==="active" && i<3 && state.projectId !== ALL_ID && !isSubtask);
  if(isPriority) li.classList.add("priority");
  li.dataset.id = task.id;

  const handle = document.createElement("div");
  handle.className="handle";
  handle.textContent="≡";

  // Color dot (before number)
  const colorDot = document.createElement("div");
  colorDot.className = "colorDot";
  colorDot.style.background = task.color || "var(--line)";
  colorDot.title = "Set color";
  colorDot.style.position = "relative";
  colorDot.onclick = (e) => {
    e.stopPropagation();
    if(activeColorPicker) activeColorPicker.remove();
    const picker = document.createElement("div");
    picker.className = "colorPicker on";
    TASK_COLORS.forEach(c => {
      const opt = document.createElement("div");
      opt.className = "colorOption" + (task.color === c ? " active" : "");
      opt.style.background = c || "var(--line)";
      if(!c) opt.innerHTML = "✕";
      opt.onclick = (ev) => {
        ev.stopPropagation();
        task.color = c;
        queueSave();
        picker.remove();
        activeColorPicker = null;
        renderAll();
      };
      picker.appendChild(opt);
    });
    colorDot.appendChild(picker);
    activeColorPicker = picker;
    // Close on outside click
    setTimeout(() => {
      const closeHandler = (ev) => {
        if(!picker.contains(ev.target)) {
          picker.remove();
          activeColorPicker = null;
          document.removeEventListener("click", closeHandler);
        }
      };
      document.addEventListener("click", closeHandler);
    }, 0);
  };

  const num = document.createElement("div");
  num.className="num";
  num.textContent = (i+1)+".";

  const mainCol = document.createElement("div");
  mainCol.className="mainCol";

  const textRow = document.createElement("div");
  textRow.className="textRow";

  if(editing.id===task.id && editing.kind==="text"){
    textRow.appendChild(makeEditInput(editing.draft,{
      onEnter:(v)=>{ if(v.trim()) updateTaskField(task,"text",v.trim()); stopEditing(); renderAll(); },
      onEscape:()=>{ stopEditing(); renderAll(); },
      onBlur:(v)=>{ if(v.trim()) updateTaskField(task,"text",v.trim()); stopEditing(); renderAll(); }
    }));
  }else{
    const span = document.createElement("span");
    span.className = "textDisplay";
    span.textContent = task.text;
    span.onclick = (e) => {
      // Ctrl+click (or Cmd+click on Mac) opens focus mode for this task
      if(e.ctrlKey || e.metaKey){
        e.preventDefault();
        openFocusForTask(task);
        return;
      }
      editing.id=task.id; editing.kind="text"; editing.draft=task.text; renderAll();
    };
    span.title = "Click to edit, Ctrl+click to focus";
    textRow.appendChild(span);

    if(isPriority){
      const badge=document.createElement("span");
      badge.className="badge";
      badge.textContent="PRIORITY";
      textRow.appendChild(badge);
    }
  }

  if(state.projectId === ALL_ID){
    const tag = document.createElement("span");
    tag.className = "badge";
    tag.textContent = projectDisplayName(task.projectId).toUpperCase();
    tag.style.opacity = ".85";
    textRow.appendChild(tag);
  }

  mainCol.appendChild(textRow);

  const metaRow = document.createElement("div");
  metaRow.className="metaRow";

  const estChip = document.createElement("div");
  estChip.className="metaChip";
  const iconWrap = document.createElement("span");
  iconWrap.innerHTML = ICONS.clock;
  iconWrap.style.display = "inline-flex";
  iconWrap.style.width = "16px";
  iconWrap.style.height = "16px";
  iconWrap.style.opacity = ".9";
  estChip.appendChild(iconWrap);

  if(editing.id===task.id && editing.kind==="estimate"){
    estChip.appendChild(makeEditInput(editing.draft,{
      placeholder:"minutes", small:true,
      onEnter:(v)=>{ saveEstimate(task,v); stopEditing(); renderAll(); },
      onEscape:()=>{ stopEditing(); renderAll(); },
      onBlur:(v)=>{ saveEstimate(task,v); stopEditing(); renderAll(); }
    }));
  }else{
    const val=document.createElement("span");
    val.className="metaVal";
    val.textContent = (task.estimateMins>0) ? `${task.estimateMins} min` : "—";
    val.style.cursor="pointer";
    val.onclick=()=>{ editing.id=task.id; editing.kind="estimate"; editing.draft=(task.estimateMins>0)?String(task.estimateMins):""; renderAll(); };
    estChip.appendChild(val);
  }

  metaRow.appendChild(estChip);
  mainCol.appendChild(metaRow);

  if(task.dependsOn && task.dependsOn.length>0){
    const blockers = blockersForTaskKey(task);
    if(blockers.length){
      const line = document.createElement("div");
      line.className = "depLine";
      line.innerHTML = `<span class="depIcon">${ICONS.link}</span><span>${escapeHtml(blockersLabel(task) || "Depends on")}</span>`;
      mainCol.appendChild(line);
    }
  }

  if(state.view==="paused" && state.projectId !== ALL_ID){
    const dependentBlocked = (task.dependsOn && task.dependsOn.length>0 && isBlocked(task));
    if(!dependentBlocked){
      const line=document.createElement("div");
      line.className="blockerLine";

      if(editing.id===task.id && editing.kind==="blocker"){
        line.innerHTML = "<strong>Blocker:</strong> ";
        line.appendChild(makeEditInput(editing.draft,{
          placeholder:"Type blocker / reason…",
          onEnter:(v)=>{ updateTaskField(task,"pausedReason",v.trim()); stopEditing(); renderAll(); },
          onEscape:()=>{ stopEditing(); renderAll(); },
          onBlur:(v)=>{ updateTaskField(task,"pausedReason",v.trim()); stopEditing(); renderAll(); }
        }));
      }else{
        const txt = task.pausedReason?.trim() ? task.pausedReason.trim() : "(click to add)";
        line.innerHTML = `<strong>Blocker:</strong> ${escapeHtml(txt)}`;
        line.style.cursor="text";
        line.onclick=()=>{ editing.id=task.id; editing.kind="blocker"; editing.draft=task.pausedReason ?? ""; renderAll(); };
      }
      mainCol.appendChild(line);
    }
  }

  const iconRow = document.createElement("div");
  iconRow.className = "iconRow";

  if(state.view==="active"){
    iconRow.appendChild(makeIconBtn("done", ()=>markDone(task), {title:"Done"}));
    iconRow.appendChild(makeIconBtn("pause", ()=>pauseWithReason(task), {title:"Pause"}));
    iconRow.appendChild(makeIconBtn("link", ()=>openLinkModalForTask(task), {title:"Link / Move"}));
    iconRow.appendChild(makeIconBtn("trash", ()=>{ if(confirm("Delete this task?")) deleteTask(task); }, {danger:true, title:"Delete"}));
  }else if(state.view==="paused"){
    iconRow.appendChild(makeIconBtn("done", ()=>markDone(task), {title:"Done"}));
    const blocked = (task.dependsOn && task.dependsOn.length>0 && isBlocked(task));
    if(!blocked) iconRow.appendChild(makeIconBtn("play", ()=>resumeTask(task), {title:"Resume"}));
    iconRow.appendChild(makeIconBtn("link", ()=>openLinkModalForTask(task), {title:"Link / Move"}));
    iconRow.appendChild(makeIconBtn("trash", ()=>{ if(confirm("Delete this task?")) deleteTask(task); }, {danger:true, title:"Delete"}));
  }else if(state.view==="done"){
    iconRow.appendChild(makeIconBtn("undo", ()=>restoreFromDone(task), {title:"Restore"}));
    iconRow.appendChild(makeIconBtn("trash", ()=>{ if(confirm("Delete this task?")) deleteTask(task); }, {danger:true, title:"Delete"}));
  }

  if(showHandle) li.appendChild(handle);
  li.appendChild(colorDot);
  if(showNum) li.appendChild(num);
  li.appendChild(mainCol);
  li.appendChild(iconRow);

  const canDrag = (editing.id===null && state.projectId !== ALL_ID && (state.view==="active" || state.view==="paused"));
  li.draggable = canDrag;
  if(canDrag){
    li.addEventListener("dragstart",()=>li.classList.add("dragging"));
    li.addEventListener("dragend",()=>{ li.classList.remove("dragging"); syncOrderFromDOMList(); });
  }
}

/* =========================================================
   PAUSED GROUPING
   ========================================================= */
function pausedGroupedList(proj){
  const dependent = [];
  const manual = [];

  for(const it of proj.paused){
    if(it.dependsOn && it.dependsOn.length>0 && isBlocked(it)) dependent.push(it);
    else manual.push(it);
  }

  const groups = new Map();
  for(const it of dependent){
    const blockers = blockersForTaskKey(it);
    const key = blockers[0] || "__unknown__";
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }

  const out = [];
  for(const [blockerKey, items] of groups.entries()){
    out.push({type:"group", blockerKey, items});
  }

  out.sort((a,b)=> String(a.blockerKey).localeCompare(String(b.blockerKey)));
  if(manual.length) out.push({type:"items", items: manual});
  return out;
}

/* =========================================================
   RENDER LIST
   ========================================================= */
function renderList(){
  const ul = $("list");
  ul.innerHTML = "";

  rolloverDoneBuckets();
  enforceDependenciesAllProjects();

  const showDoneUI = (state.page==="list" && state.view==="done");
  $("listTopRow").style.display = showDoneUI ? "" : "none";

  if(state.projectId === ALL_ID){
    const items = currentList();
    items.forEach((task,i)=>{
      const li = document.createElement("li");
      renderItem(li, task, i, {showHandle:false, showNum:true});
      ul.appendChild(li);
    });
    renderListFooter();
    return;
  }

  const proj = currentProject();

  if(state.view==="paused"){
    const blocks = pausedGroupedList(proj);
    let countIndex = 0;
    const idx = allTasksIndexAllProjects();

    for(const blk of blocks){
      if(blk.type === "group"){
        const header = document.createElement("div");
        header.className = "groupHeader";
        const bt = idx.get(blk.blockerKey)?.text || "(unknown)";
        header.innerHTML = `<span class="depIcon">${ICONS.link}</span><span>Waiting for: ${escapeHtml(bt)}</span>`;
        ul.appendChild(header);

        blk.items.forEach((task)=>{
          const li = document.createElement("li");
          renderItem(li, task, countIndex++, {showHandle:true, showNum:true, nested:true});
          ul.appendChild(li);
        });
      }else{
        blk.items.forEach((task)=>{
          const li = document.createElement("li");
          renderItem(li, task, countIndex++, {showHandle:true, showNum:true});
          ul.appendChild(li);
        });
      }
    }
    if(editing.id===null) enableDragList(ul);
    renderListFooter();
    return;
  }

  const items = currentList();
  items.forEach((task,i)=>{
    const li = document.createElement("li");
    renderItem(li, task, i, {showHandle:true, showNum:true});
    ul.appendChild(li);
  });

  if(editing.id===null && (state.view==="active" || state.view==="paused")) enableDragList(ul);
  renderListFooter();
}

/* =========================================================
   SUMMARY PAGE
   ========================================================= */
function sectionCounts(proj){
  return {
    active: proj.active.length,
    paused: proj.paused.length,
    doneToday: proj.done_today.length,
    doneWeek: proj.done_week.length
  };
}
function currentTaskHTMLForProject(proj){
  const top = proj.active[0];
  const title = top ? escapeHtml(top.text) : "No active task";
  const meta = top
    ? `Item 1 of ${proj.active.length}${top.estimateMins>0 ? ` · Estimate: ${top.estimateMins} min` : ""}`
    : "No active items";

  return `
    <div class="focusPreview">
      <div class="focusMark"></div>
      <div>
        <p class="focusTitle">${title}</p>
        <div class="focusMeta">${meta}</div>
      </div>
    </div>
  `;
}

function renderSummaryPage(){
  const grid = document.createElement("div");
  grid.id = "summaryGrid";
  grid.className = "summaryGrid";
  grid.innerHTML = "";

  for(const pid of state.data.projectOrder){
    const proj = getProject(pid);
    if(!proj) continue;
    const c = sectionCounts(proj);

    const tile = document.createElement("div");
    tile.className = "summaryCard tile";
    tile.dataset.pid = pid;

    const h = document.createElement("h3");
    h.style.cursor = "pointer";
    h.textContent = proj.name.toUpperCase();
    h.onclick = ()=>{
      state.projectId = pid;
      setPage("list");
    };

    const divider1 = document.createElement("div");
    divider1.className = "miniDivider";

    const body = document.createElement("div");
    body.innerHTML = currentTaskHTMLForProject(proj);

    const divider2 = document.createElement("div");
    divider2.className = "miniDivider";

    const rows = document.createElement("div");
    rows.innerHTML = `
      <div class="summaryRow"><span>Active</span><span class="kpi">${c.active}</span></div>
      <div class="summaryRow"><span>Paused</span><span class="kpi">${c.paused}</span></div>
      <div class="summaryRow"><span>Done (today)</span><span class="kpi">${c.doneToday}</span></div>
      <div class="summaryRow"><span>Done (week)</span><span class="kpi">${c.doneWeek}</span></div>
    `;

    tile.appendChild(h);
    tile.appendChild(divider1);
    tile.appendChild(body);
    tile.appendChild(divider2);
    tile.appendChild(rows);

    tile.draggable = true;
    tile.addEventListener("dragstart",()=>tile.classList.add("dragging"));
    tile.addEventListener("dragend",()=>{ tile.classList.remove("dragging"); syncProjectOrderFromDOM(); });

    grid.appendChild(tile);
  }

  $("summaryPage").innerHTML = "";
  $("summaryPage").appendChild(grid);

  enableDragProjects(grid);

  $("summaryPage").insertAdjacentHTML("beforeend",
    `<div class="summaryHint">Drag tiles to reorder projects. Click ESPRESSO (icon or title) to return to the list.</div>`
  );
}

/* =========================================================
   FOCUS MODE + NOTES
   ========================================================= */
let focusedTaskKey = null; // Track specific focused task (null = top task)

function focusTopTask(){
  if(state.projectId === ALL_ID){
    for(const pid of state.data.projectOrder){
      const proj = getProject(pid);
      if(proj && proj.active[0]) return proj.active[0];
    }
    return null;
  }
  const proj = currentProject();
  return proj.active[0] || null;
}

function getCurrentFocusTask(){
  // If a specific task is focused, return it (if still exists)
  if(focusedTaskKey){
    const task = getTaskByKey(focusedTaskKey);
    if(task) return task;
    // Task no longer exists, clear focus
    focusedTaskKey = null;
  }
  return focusTopTask();
}

function renderFocus(){
  const top = getCurrentFocusTask();
  const isTopTask = !focusedTaskKey || (top && taskKey(top) === taskKey(focusTopTask() || {}));

  $("focusText").textContent = top ? top.text : "No active items";

  let metaText = "";
  if(top){
    const proj = getProject(top.projectId);
    const activeList = proj?.active || [];
    const idx = activeList.findIndex(t => t.id === top.id);
    const position = idx >= 0 ? `Item ${idx + 1} of ${activeList.length}` : "Focused task";
    metaText = `${projectDisplayName(top.projectId).toUpperCase()} · ${position}${top.estimateMins>0 ? ` · Estimate: ${top.estimateMins} min` : ""}`;
    if(!isTopTask) metaText += " · (Custom focus)";
  }else{
    metaText = projectDisplayName(state.projectId).toUpperCase();
  }
  $("focusMeta").textContent = metaText;

  const est = top?.estimateMins ?? 0;
  if(top && est>0){
    focusEstimateLine.style.display="";
    focusEstimateLine.textContent = `Estimate: ${est} min`;
  }else{
    focusEstimateLine.style.display="none";
  }

  showFocusNotesForTask(top);

  const row = $("focusIconRow");
  row.innerHTML = "";
  if(!top) return;

  const taskPid = top.projectId;
  const canDoActions = (state.projectId !== ALL_ID) || (taskPid && getProject(taskPid));

  if(canDoActions){
    row.appendChild(makeIconBtn("done", ()=>{ markDoneFromFocus(top); }, {title:"Done"}));
    row.appendChild(makeIconBtn("pause", ()=>{ pauseFromFocus(top); }, {title:"Pause"}));
  }
  row.appendChild(makeIconBtn("link", ()=>openLinkModalForTask(top), {title:"Link / Move"}));
  row.appendChild(makeIconBtn("trash", ()=>{ if(confirm("Delete this task?")){ deleteTask(top); focusedTaskKey = null; } }, {danger:true, title:"Delete"}));
}

function markDoneFromFocus(task){
  // Temporarily switch context if needed
  const prevPid = state.projectId;
  if(state.projectId === ALL_ID) state.projectId = task.projectId;
  markDone(task);
  focusedTaskKey = null; // Go back to top task after marking done
  state.projectId = prevPid;
  renderFocus();
  updateFocusTimerUI();
}

function pauseFromFocus(task){
  const prevPid = state.projectId;
  if(state.projectId === ALL_ID) state.projectId = task.projectId;
  pauseWithReason(task);
  focusedTaskKey = null;
  state.projectId = prevPid;
  renderFocus();
  updateFocusTimerUI();
}

function openFocus(){
  focusedTaskKey = null; // Default to top task
  focusOverlay.classList.add("on");
  document.body.style.overflow="hidden";
  renderFocus();
  updateFocusTimerUI();
}

function openFocusForTask(task){
  focusedTaskKey = taskKey(task);
  focusOverlay.classList.add("on");
  document.body.style.overflow="hidden";
  renderFocus();
  updateFocusTimerUI();
}

function closeFocus(){
  focusOverlay.classList.remove("on");
  document.body.style.overflow="";
  focusedTaskKey = null;
}
focusOverlay.addEventListener("click",(e)=>{ if(e.target===focusOverlay) closeFocus(); });

/* =========================================================
   TIMER (persistent)
   ========================================================= */
let timerInterval=null, timerRunning=false, timerRemainingMs=0, timerEndMs=0;
let timerTaskKey = null; // FIX: Track which task the timer is for

function persistTimer(){
  try{
    localStorage.setItem(TIMER_KEY, JSON.stringify({
      running: timerRunning,
      remainingMs: timerRemainingMs,
      endMs: timerEndMs,
      taskKey: timerTaskKey
    }));
  }catch{}
}
function loadTimer(){
  try{
    const raw = localStorage.getItem(TIMER_KEY);
    if(!raw) return;
    const t = JSON.parse(raw);
    timerRunning = !!t.running;
    timerRemainingMs = Number(t.remainingMs||0);
    timerEndMs = Number(t.endMs||0);
    timerTaskKey = t.taskKey || null;

    if(timerRunning){
      const rem = timerEndMs - Date.now();
      if(rem <= 0){
        timerRunning=false;
        timerRemainingMs=0;
      }else{
        timerRemainingMs = rem;
        startTicking();
      }
    }
    updateHeaderTimer();
  }catch{}
}
function startTicking(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(timerRunning){
      const rem = timerEndMs - Date.now();
      if(rem <= 0){
        timerRunning=false;
        timerRemainingMs=0;
        persistTimer();
        updateHeaderTimer();
        beep();
        return;
      }
      timerRemainingMs = rem;
      persistTimer();
    }
    updateHeaderTimer();
    if(focusOverlay.classList.contains("on")) updateFocusTimerUI();
    if(state.page === "summary") renderSummaryPage();
  }, 250);
}
function fmt(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateHeaderTimer(){
  if(timerRunning || timerRemainingMs>0){
    timerHeader.style.display="inline-flex";
    timerHeader.textContent = timerRunning
      ? `Timer ${fmt(Math.max(0, timerEndMs-Date.now()))}`
      : `Paused ${fmt(timerRemainingMs)}`;
  }else{
    timerHeader.style.display="none";
    timerHeader.textContent="";
  }
}
function updateFocusTimerUI(){
  const top = getCurrentFocusTask();
  const est = Number(top?.estimateMins||0);

  const hasEstimate = Number.isFinite(est) && est>0;
  $("focusTimerReset").style.display = hasEstimate ? "" : "none";

  if(!hasEstimate){
    $("focusTimerText").textContent = "—";
    $("focusTimerHint").style.display = "";
    $("focusTimerHint").textContent = "Click to set estimate";
    return;
  }

  $("focusTimerHint").style.display = "none";

  if(timerRunning){
    const rem = Math.max(0, timerEndMs - Date.now());
    $("focusTimerText").textContent = fmt(rem);
  }else if(timerRemainingMs>0){
    $("focusTimerText").textContent = fmt(timerRemainingMs);
  }else{
    $("focusTimerText").textContent = fmt(est*60*1000);
  }
}
function resetTimerToEstimate(mins, forTaskKey=null){
  const ms = Math.max(0, Math.round(Number(mins||0))) * 60 * 1000;
  timerRunning=false;
  timerRemainingMs = ms;
  timerEndMs = 0;
  timerTaskKey = forTaskKey;
  persistTimer();
  updateHeaderTimer();
}
function resumeTimer(){
  if(timerRemainingMs<=0) return;
  timerRunning=true;
  timerEndMs = Date.now() + timerRemainingMs;
  persistTimer();
  startTicking();
  updateHeaderTimer();
  updateFocusTimerUI();
}
function pauseTimer(){
  if(!timerRunning) return;
  timerRunning=false;
  timerRemainingMs = Math.max(0, timerEndMs - Date.now());
  timerEndMs = 0;
  persistTimer();
  updateHeaderTimer();
  updateFocusTimerUI();
}
function stopTimer(){
  timerRunning=false;
  timerRemainingMs=0;
  timerEndMs=0;
  timerTaskKey=null;
  persistTimer();
  updateHeaderTimer();
  updateFocusTimerUI();
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.value=0.06;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    setTimeout(()=>{o.stop();ctx.close();},220);
  }catch{}
}

$("focusTimerPill").onclick = ()=>{
  const top = getCurrentFocusTask();
  if(!top) return;

  const currentKey = taskKey(top);

  if((top.estimateMins||0) <= 0){
    const raw = prompt("Set estimate (minutes):", "");
    if(raw===null) return;
    const n = Math.round(Number(String(raw).trim()));
    if(!Number.isFinite(n) || n<=0) return;
    top.estimateMins = n;
    resetTimerToEstimate(n, currentKey);
    queueSave();
    renderAll();
    return;
  }

  if(timerTaskKey && timerTaskKey !== currentKey){
    resetTimerToEstimate(top.estimateMins, currentKey);
    resumeTimer();
    return;
  }

  if(timerRunning){
    pauseTimer();
  }else{
    if(timerRemainingMs<=0) resetTimerToEstimate(top.estimateMins, currentKey);
    resumeTimer();
  }
};
$("focusTimerReset").onclick = ()=>{
  const top = getCurrentFocusTask();
  if(!top) return;
  const est = Number(top.estimateMins||0);
  if(!Number.isFinite(est) || est<=0) return;
  resetTimerToEstimate(est, taskKey(top));
  updateFocusTimerUI();
};

/* =========================================================
   MASTER RENDER
   ========================================================= */
function renderAll(){
  ensureCurrentProject();
  updateSectionHeader();
  renderProjectMenu();

  if(state.page === "summary"){
    $("summaryPage").style.display = "";
    $("list").style.display = "none";
    $("summaryTabs").style.display = "none";
    $("listFooter").style.display = "none";
    $("listTopRow").style.display = "none";
    renderSummaryPage();
    return;
  }

  $("summaryPage").style.display = "none";
  $("list").style.display = "";
  $("summaryTabs").style.display = "";
  $("newText").disabled = (state.projectId === ALL_ID);
  $("newText").placeholder = (state.projectId === ALL_ID) ? "Select a project to add tasks…" : "Add a task…";

  renderList();
  renderFocus();
  updateFocusTimerUI();
}

/* =========================================================
   WIRING
   ========================================================= */
qsa(".summaryTab").forEach(b=>b.onclick=()=>setView(b.dataset.view));
qsa(".doneBtn").forEach(b=>b.onclick=()=>setDoneFilter(b.dataset.done));

$("newText").addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){
    e.preventDefault();
    addItem($("newText").value);
    $("newText").value="";
  }
});

$("clearDoneBtn").onclick = ()=>{
  if(state.projectId === ALL_ID) return;
  const proj = currentProject();
  const arr = (state.doneFilter==="today") ? proj.done_today : proj.done_week;
  if(arr.length===0) return;
  if(confirm(`Clear ${state.doneFilter==="today" ? "Done Today" : "Done This Week"} for ${projectDisplayName(state.projectId)}?`)){
    clearDoneCurrent();
  }
};

$("focusBtn").onclick = openFocus;
$("focusClose").onclick = closeFocus;

$("resetBtn").onclick = ()=>{
  if(!confirm("Clear ALL projects and tasks? This overwrites state.json.")) return;

  state.data.projects = {};
  state.data.projectOrder = [];

  const w = fixProject({ ...defaultProject("Work"), id:"work", name:"Work" });
  const p = fixProject({ ...defaultProject("Personal"), id:"personal", name:"Personal" });
  state.data.projects.work = w;
  state.data.projects.personal = p;
  state.data.projectOrder = ["work","personal"];

  state.projectId = "work";
  state.view = "active";
  state.doneFilter = "today";
  state.page = "list";

  stopEditing();
  stopTimer();

  qsa(".summaryTab").forEach(b=>b.classList.toggle("active", b.dataset.view===state.view));
  qsa(".doneBtn").forEach(b=>b.classList.toggle("active", b.dataset.done===state.doneFilter));

  queueSave();
  renderAll();
  closeFocus();
};

$("forceSaveBtn").onclick = async ()=>{
  try{
    setStatus("Force saving…");
    await saveNow({silent:true, force:true});

    const g = await fetchWithTimeout(API_URL,{method:"GET",cache:"no-store"}, 5000);
    const server = await g.json();
    state.data = fixState(server);
    state.data.meta.owner = CLIENT_ID;

    ensureCurrentProject();
    rolloverDoneBuckets();
    enforceDependenciesAllProjects();

    try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(state.data)); }catch{}

    setStatus("Force saved");
    renderAll();
  }catch(e){
    console.error(e);
    setStatus("FORCE SAVE FAILED");
  }
};

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  initTheme();
  initCompact();

  qsa(".summaryTab").forEach(b=>b.classList.toggle("active", b.dataset.view===state.view));
  qsa(".doneBtn").forEach(b=>b.classList.toggle("active", b.dataset.done===state.doneFilter));

  await loadAll();
  loadTimer();
  startTicking();

  setPage("list");
  renderAll();
  updateHeaderTimer();
})();
</script>
