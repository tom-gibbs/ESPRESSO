<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ESPRESSO</title>
<link rel="icon" type="image/png" href="espresso-icon.png" />

<style>
/* =========================================================
   THEME TOKENS
   ========================================================= */

/* DARK */
:root,
html[data-theme="dark"]{
  --bg:#07080b;
  --paper:rgba(17,19,25,.74);
  --paper2:rgba(13,15,20,.72);
  --text:#eef0f4;
  --muted:rgba(238,240,244,.68);
  --line:rgba(238,240,244,.10);
  --shadow:0 28px 90px rgba(0,0,0,.55);

  --espresso:#d7b07a;
  --accent:#d7b07a;

  --r-xl:24px;
  --r-lg:18px;
  --r-md:14px;
  --r-sm:12px;

  --chipBg: rgba(0,0,0,.16);
  --itemBg: rgba(255,255,255,.04);
  --itemBg2: rgba(255,255,255,.06);
}

/* LIGHT */
html[data-theme="light"]{
  --bg:#fbfaf7;
  --paper:#ffffff;
  --paper2:#f7f3eb;
  --text:#1f2328;
  --muted:#6b7280;
  --line:rgba(16,24,40,.10);
  --shadow:0 18px 60px rgba(15,23,42,.08);

  --espresso:#6b4a2b;
  --accent:#9a6a3a;

  --chipBg: rgba(15,23,42,.03);
  --itemBg: rgba(255,255,255,.78);
  --itemBg2: rgba(215,176,122,.16);
}

/* =========================================================
   BASE
   ========================================================= */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(215,176,122,.20), transparent 62%),
    radial-gradient(900px 520px at 95% 10%, rgba(138,90,43,.16), transparent 58%),
    var(--bg);
}
html[data-theme="light"] body{
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(154,106,58,.10), transparent 62%),
    radial-gradient(900px 520px at 95% 10%, rgba(215,176,122,.20), transparent 58%),
    var(--bg);
}

/* Container */
.wrap{max-width:1100px;margin:22px auto 40px;padding:0 16px}
.card{
  background: linear-gradient(180deg, var(--paper), var(--paper2));
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow);
  overflow:visible;
  backdrop-filter: blur(10px);
}
/* Clip corners inside card without clipping dropdowns */
.content{
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  overflow: hidden;
}

/* =========================================================
   TOPBAR
   ========================================================= */
.topbar{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  gap:12px;
  align-items:center;
  min-width:260px;
  cursor:pointer;
  user-select:none;
}
.brand img{
  width:42px;height:42px;border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  box-shadow:0 16px 30px rgba(0,0,0,.25);
}
html[data-theme="light"] .brand img{
  background: rgba(255,255,255,.92);
  box-shadow: 0 12px 24px rgba(15,23,42,.10);
}
.brand .title{display:flex;flex-direction:column;line-height:1.1}
.brand h2{margin:0;font-size:14px;letter-spacing:.22em;font-weight:800}
.brand .subtitle{margin-top:4px;font-size:12px;color:var(--muted)}
.spacer{flex:1}
.status{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:999px;background:var(--accent);opacity:.6}
.timerBadge{
  display:none;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--text);
  background: rgba(215,176,122,.14);
  border: 1px solid rgba(215,176,122,.28);
  padding: 8px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
html[data-theme="light"] .timerBadge{
  color: var(--text);
  background: rgba(154,106,58,.10);
  border: 1px solid rgba(154,106,58,.18);
}

/* Buttons */
.actionsTop{display:flex;gap:8px;flex-wrap:wrap}
button{
  appearance:none;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  border-radius:999px;
  padding:10px 12px;
  font-size:13px;
  cursor:pointer;
}
html[data-theme="light"] button{ background: rgba(255,255,255,.86); }
button.primary{background:rgba(215,176,122,.22);border-color:rgba(215,176,122,.32);font-weight:700}
html[data-theme="light"] button.primary{ background: rgba(215,176,122,.26); border-color: rgba(154,106,58,.18); }
button.subtle{background:rgba(255,255,255,.04);color:var(--muted)}
html[data-theme="light"] button.subtle{ background: rgba(15,23,42,.03); }
button.danger{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.20)}
button.accent{background:rgba(215,176,122,.18);border-color:rgba(215,176,122,.28);font-weight:650}
button.iconTopBtn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
button.iconTopBtn svg{width:18px;height:18px;display:block}

/* =========================================================
   CONTENT
   ========================================================= */
.content{display:block}
.main{padding:18px}

/* =========================================================
   PROJECT DROPDOWN
   ========================================================= */
.sectionHeaderWrap{
  margin:2px 0 12px;
  display:flex;
  align-items:center;
  position:relative;
  min-height:46px;
  overflow:visible;
}
.sectionHeaderBtn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);font-weight:950;letter-spacing:.18em;font-size:16px;
  cursor:pointer;
}
html[data-theme="light"] .sectionHeaderBtn{ background: rgba(255,255,255,.92); }
.sectionHeaderBtn:active{transform:translateY(1px)}

.projectMenu{
  position:absolute;
  top:52px;
  left:0;
  z-index:9998;
  display:none;
  width:min(520px, 92vw);
  min-width:320px;
  background: linear-gradient(180deg, rgba(17,19,25,.92), rgba(17,19,25,.82));
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  box-shadow:0 40px 140px rgba(0,0,0,.65);
  padding:10px;
}
html[data-theme="light"] .projectMenu{
  background: rgba(255,255,255,.96);
  border:1px solid var(--line);
  box-shadow:0 30px 120px rgba(15,23,42,.18);
}
.projectMenu.on{display:block}
.projectMenuTop{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:6px 6px 10px;
  border-bottom:1px solid var(--line);
}
.projectMenuTop input{
  flex:1;
  border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.12);
  padding:10px 12px;font-size:13px;color:var(--text);outline:none;
}
html[data-theme="light"] .projectMenuTop input{background:rgba(255,255,255,.92);color:var(--text)}
.projectMenuList{padding:8px 6px 6px;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.projectRow{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:14px;
  border:1px solid var(--line);
  background: rgba(255,255,255,.03);
}
html[data-theme="light"] .projectRow{ background: rgba(255,255,255,.92); }
.projectRow:hover{background: rgba(255,255,255,.06)}
html[data-theme="light"] .projectRow:hover{ background: rgba(15,23,42,.03); }
.projectNameBtn{
  flex:1;
  background:transparent;border:0;
  padding:0;margin:0;
  color:var(--text);
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
html[data-theme="light"] .projectNameBtn{ color: var(--text); }
.projectNameMeta{
  font-size:12px;color:var(--muted);font-weight:650;margin-left:8px;
}
.projectRow .right{display:flex;gap:8px;align-items:center}
.iconBtn{
  width:34px;height:34px;padding:0;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:var(--text);
}
html[data-theme="light"] .iconBtn{ background: rgba(255,255,255,.92); color: var(--text); }
.iconBtn:hover{background:rgba(255,255,255,.08)}
html[data-theme="light"] .iconBtn:hover{background:rgba(15,23,42,.04)}
.iconBtn:active{transform:translateY(1px)}
.iconBtn svg{width:18px;height:18px;display:block}
.iconBtn.danger{
  border-color: rgba(239,68,68,.20);
  background: rgba(239,68,68,.08);
}
html[data-theme="light"] .iconBtn.danger{ background: rgba(239,68,68,.06); }

/* Input */
.addRow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
input[type="text"]{
  flex:1;border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.12);
  padding:12px 14px;font-size:14px;color:var(--text);outline:none;
}
html[data-theme="light"] input[type="text"]{background:rgba(255,255,255,.92);color:var(--text)}
input[type="text"]::placeholder{color:rgba(238,240,244,.52)}
html[data-theme="light"] input[type="text"]::placeholder{color:rgba(107,114,128,.85)}
input[type="text"]:focus{border-color:rgba(215,176,122,.30);box-shadow:0 0 0 4px rgba(215,176,122,.18)}
html[data-theme="light"] input[type="text"]:focus{
  border-color: rgba(154,106,58,.22);
  box-shadow: 0 0 0 4px rgba(215,176,122,.18);
}

/* Tabs */
.summaryTabs{
  display:inline-flex;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:999px;
  padding:4px;gap:4px;margin:6px 0 14px;
}
html[data-theme="light"] .summaryTabs{background:rgba(15,23,42,.03)}
.summaryTab{
  border:0;background:transparent;padding:10px 12px;border-radius:999px;
  color:var(--muted);font-size:13px;cursor:pointer;
}
.summaryTab.active{
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  color:var(--text);
  box-shadow:0 14px 40px rgba(0,0,0,.20);
}
html[data-theme="light"] .summaryTab.active{
  background: rgba(255,255,255,.92);
  box-shadow: 0 10px 30px rgba(15,23,42,.08);
}

/* Done filters */
.doneFilters{display:none;margin:0 0 12px}
.doneFilters.on{display:flex}
.doneToggle{
  display:inline-flex;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:999px;
  padding:4px;gap:4px;
}
html[data-theme="light"] .doneToggle{background:rgba(15,23,42,.03)}
.doneBtn{
  border:0;background:transparent;padding:10px 12px;border-radius:999px;
  color:var(--muted);font-size:13px;cursor:pointer;
}
.doneBtn.active{
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  color:var(--text);
}
html[data-theme="light"] .doneBtn.active{ background: rgba(255,255,255,.92); }

/* Clear done row */
.listTopRow{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:0 0 10px;
}

/* List */
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px;border-radius:var(--r-lg);
  border:1px solid var(--line);
  background:var(--itemBg);
  transition: transform 0.15s ease, opacity 0.15s ease, margin 0.15s ease;
}
.item.priority{background:var(--itemBg2);border-color:rgba(215,176,122,.22)}
.item.dragging{opacity:.6;transform:scale(1.02);box-shadow:0 8px 32px rgba(0,0,0,.25)}
.item.drag-over{margin-top:52px}
.item.nested{ margin-left: 18px; position: relative; }

/* Subtask indentation */
.item.subtask{margin-left:28px;position:relative}
.item.subtask:before{
  content:"";position:absolute;
  left:-14px;top:50%;width:8px;height:1px;
  background:var(--line);
}
.item.has-children .textDisplay{cursor:pointer}
.collapseIcon{
  width:20px;height:20px;margin-right:4px;margin-top:2px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;transition:transform 0.15s ease;
}
.collapseIcon.collapsed{transform:rotate(-90deg)}
.item.collapsed-children + .item.subtask{display:none}

/* Color dots for task tagging */
.colorDot{
  width:10px;height:10px;border-radius:999px;
  flex-shrink:0;margin-top:5px;
  cursor:pointer;opacity:.85;
  transition:transform 0.1s ease;
}
.colorDot:hover{transform:scale(1.3)}
.colorPicker{
  position:absolute;top:100%;left:0;z-index:100;
  display:none;padding:6px;gap:6px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.colorPicker.on{display:flex}
.colorOption{
  width:20px;height:20px;border-radius:999px;
  cursor:pointer;border:2px solid transparent;
  transition:transform 0.1s ease;
}
.colorOption:hover{transform:scale(1.2)}
.colorOption.active{border-color:var(--text)}

/* Compact mode */
html[data-compact="true"] .item{padding:8px 10px;gap:8px}
html[data-compact="true"] .list{gap:6px}
html[data-compact="true"] .textDisplay{font-size:13px}
html[data-compact="true"] .metaRow{margin-top:4px;font-size:11px}
html[data-compact="true"] .metaChip{padding:4px 8px}
html[data-compact="true"] .handle{width:24px;height:24px;font-size:14px}
html[data-compact="true"] .num{width:28px;font-size:11px;margin-top:4px}
html[data-compact="true"] .iconBtn{width:28px;height:28px}
html[data-compact="true"] .iconBtn svg{width:14px;height:14px}
html[data-compact="true"] .blockerLine,
html[data-compact="true"] .depLine{padding:6px 10px;font-size:11px;margin-top:6px}
.item.nested:before{
  content:"";
  position:absolute;
  left:-10px; top:16px; bottom:16px;
  width:1px;
  background: var(--line);
  opacity:.8;
}
.handle{
  width:30px;height:30px;border-radius:10px;
  border:1px dashed rgba(238,240,244,.22);
  color:rgba(238,240,244,.70);
  display:flex;align-items:center;justify-content:center;
  user-select:none;font-size:16px;line-height:1;margin-top:2px;cursor:grab;
}
html[data-theme="light"] .handle{border:1px dashed rgba(107,114,128,.35);color:rgba(107,114,128,.85);}
.num{
  width:36px;text-align:right;
  font-variant-numeric: tabular-nums;
  color:rgba(238,240,244,.55);
  margin-top:6px;font-size:13px;
}
html[data-theme="light"] .num{color:rgba(107,114,128,.85)}
.mainCol{flex:1;min-width:240px}
.textRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.textDisplay{font-size:15px;padding:2px 0;cursor:text;color:rgba(255,255,255,.92);font-weight:600;}
html[data-theme="light"] .textDisplay{color:var(--text)}
.priority .textDisplay{font-weight:800}
.badge{
  font-size:11px;padding:4px 8px;border-radius:999px;
  border:1px solid rgba(215,176,122,.28);
  color:rgba(255,255,255,.92);
  background:rgba(215,176,122,.12);
  font-weight:800;letter-spacing:.08em;
}
html[data-theme="light"] .badge{
  border:1px solid rgba(154,106,58,.18);
  color: var(--espresso);
  background: rgba(215,176,122,.18);
}
.metaRow{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:rgba(238,240,244,.66);font-size:13px;}
html[data-theme="light"] .metaRow{color:var(--muted)}
.metaChip{
  display:inline-flex;gap:8px;align-items:center;
  padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);
  background:var(--chipBg);
}
.metaVal{font-variant-numeric: tabular-nums;color:rgba(255,255,255,.86);opacity:.95;font-weight:700;}
html[data-theme="light"] .metaVal{color:var(--text);opacity:.85;font-weight:650}

.blockerLine{
  margin-top:10px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid rgba(239,68,68,.20);
  background:rgba(239,68,68,.08);
  color:rgba(255,255,255,.88);
  font-size:13px;line-height:1.25;
}
html[data-theme="light"] .blockerLine{
  border:1px solid rgba(185,28,28,.14);
  background:rgba(185,28,28,.05);
  color:rgba(140,24,24,.92);
}
.depLine{
  margin-top:10px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid rgba(215,176,122,.22);
  background:rgba(215,176,122,.10);
  color:rgba(255,255,255,.88);
  font-size:13px;line-height:1.25;
  display:flex;gap:10px;align-items:flex-start;
}
html[data-theme="light"] .depLine{
  border:1px solid rgba(154,106,58,.18);
  background: rgba(215,176,122,.14);
  color: rgba(31,35,40,.92);
}
.depIcon{display:inline-flex;width:16px;height:16px;margin-top:2px;opacity:.85;}
.depIcon svg{width:16px;height:16px;display:block}

.editInput{
  width:100%;padding:10px 12px;border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.16);color:var(--text);outline:none;font-size:14px;
}
html[data-theme="light"] .editInput{background:rgba(255,255,255,.92);color:var(--text)}
.editInput.small{width:140px}

.iconRow{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:4px;}

/* Paused grouping header */
.groupHeader{
  padding:10px 12px;border-radius:var(--r-lg);
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:rgba(238,240,244,.72);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
html[data-theme="light"] .groupHeader{background: rgba(255,255,255,.92);color: rgba(31,35,40,.70);}

/* List footer */
.listFooter{
  margin-top: 10px;
  display:flex;
  justify-content:flex-end;
  font-size: 12px;
  color: rgba(238,240,244,.56);
}
html[data-theme="light"] .listFooter{ color: rgba(107,114,128,.85); }

/* =========================================================
   LINK MODAL
   ========================================================= */
.modalOverlay{
  position:fixed;inset:0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  display:none; z-index:10000;
}
html[data-theme="light"] .modalOverlay{ background: rgba(15,23,42,.55); }
.modalOverlay.on{display:block}
.modalInner{height:100%;display:flex;align-items:center;justify-content:center;padding:22px}
.modalBox{
  width:min(760px,96vw);
  max-height: calc(100vh - 44px);
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(17,19,25,.92), rgba(17,19,25,.82));
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  box-shadow:0 40px 140px rgba(0,0,0,.65);
  padding:18px;
}
html[data-theme="light"] .modalBox{
  background: rgba(255,255,255,.94);
  border: 1px solid var(--line);
  box-shadow:0 30px 120px rgba(15,23,42,.18);
}
.modalTitle{font-weight:950;letter-spacing:-.01em;font-size:18px;margin:0}
.modalSub{margin-top:8px;color:var(--muted);font-size:13px}
.modalList{margin-top:14px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.modalRow{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);
  background: rgba(255,255,255,.03);
}
.modalRow:last-child{border-bottom:0}
html[data-theme="light"] .modalRow{ background: rgba(255,255,255,.92); }
.modalRow label{cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%}
.modalRow input{margin-top:3px}
.modalRow .t{font-weight:750;color:rgba(255,255,255,.92)}
html[data-theme="light"] .modalRow .t{color:var(--text)}
.modalRow .m{margin-top:4px;color:var(--muted);font-size:12px}
.modalRow.disabled{opacity:.55}

.modalActions{
  display:flex; gap:10px; margin-top:14px;
  justify-content:space-between; align-items:center; flex-wrap:wrap;
}
.unlinkRow{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.unlinkSelect{
  border-radius:999px;border:1px solid var(--line);
  background: rgba(255,255,255,.06);
  color: var(--text);
  padding: 10px 12px;
  font-size: 13px;
  outline:none;
}
html[data-theme="light"] .unlinkSelect{background: rgba(255,255,255,.92);color: var(--text);}

.unlinkBtnIcon{
  width:34px;height:34px;padding:0;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(239,68,68,.20);
  background: rgba(239,68,68,.08);
  color: var(--text);
}
html[data-theme="light"] .unlinkBtnIcon{background: rgba(239,68,68,.06);}
.unlinkBtnIcon svg{width:18px;height:18px;display:block}
.unlinkBtnIcon:hover{background: rgba(239,68,68,.12)}
html[data-theme="light"] .unlinkBtnIcon:hover{ background: rgba(239,68,68,.08); }

.moveRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.moveSelect{
  border-radius:999px;border:1px solid var(--line);
  background: rgba(255,255,255,.06);
  color: var(--text);
  padding: 10px 12px;
  font-size: 13px;
  outline:none;
  min-width: 220px;
}
html[data-theme="light"] .moveSelect{ background: rgba(255,255,255,.92); color: var(--text); }

.modalActions .right{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* =========================================================
   FOCUS OVERLAY (includes Notes panel)
   ========================================================= */
.focusOverlay{
  position:fixed;inset:0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  display:none; z-index:9999;
}
html[data-theme="light"] .focusOverlay{ background: rgba(15,23,42,.55); }
.focusOverlay.on{display:block}
.focusInner{height:100%;display:flex;align-items:center;justify-content:center;padding:22px}
.focusBox{
  width:min(920px,96vw);
  background: linear-gradient(180deg, rgba(17,19,25,.92), rgba(17,19,25,.82));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 28px;
  box-shadow:0 40px 140px rgba(0,0,0,.65);
  padding: 22px;
}
html[data-theme="light"] .focusBox{
  background: rgba(255,255,255,.94);
  border: 1px solid var(--line);
  box-shadow:0 30px 120px rgba(15,23,42,.18);
}
.focusMain{
  font-size: clamp(26px, 4vw, 48px);
  font-weight: 950;
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.02em;
  color: rgba(255,255,255,.95);
}
html[data-theme="light"] .focusMain{ color: var(--text); font-weight:900; }
.focusSub{color: rgba(238,240,244,.66);font-size: 14px;margin-top: 10px;}
html[data-theme="light"] .focusSub{ color: var(--muted); }

.focusTimerRow{margin-top: 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.focusTimerPill{
  display:inline-flex;gap:10px;align-items:center;
  padding: 10px 12px;border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.92);
  cursor:pointer; user-select:none;
}
html[data-theme="light"] .focusTimerPill{background: rgba(255,255,255,.92);color: var(--text);}
.focusTimerPill svg{width:18px;height:18px;display:block;opacity:.9}
.focusTimerText{font-variant-numeric: tabular-nums;font-weight: 850;letter-spacing: .5px;}
.focusTimerHint{font-size:12px;color: rgba(238,240,244,.62);}
html[data-theme="light"] .focusTimerHint{ color: var(--muted); }
.focusTimerReset{
  width:34px;height:34px;padding:0;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.05);
  color: var(--text);
  cursor:pointer;
}
html[data-theme="light"] .focusTimerReset{background: rgba(255,255,255,.92);color: var(--text);}
.focusTimerReset svg{width:18px;height:18px;display:block}

.focusNotes{
  margin-top:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background: rgba(255,255,255,.03);
  padding:12px;
}
html[data-theme="light"] .focusNotes{ background: rgba(255,255,255,.92); }
.focusNotesTitle{
  display:flex;align-items:center;gap:10px;
  color: var(--muted);
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.focusNotesBox{
  margin-top:10px;
  width:100%;
  border-radius:14px;
  border:1px solid var(--line);
  background: rgba(0,0,0,.12);
  color: var(--text);
  padding:12px;
  outline:none;
  font-size:14px;
  line-height:1.35;
  min-height:120px;
  resize:vertical;
}
html[data-theme="light"] .focusNotesBox{ background: rgba(255,255,255,.92); color: var(--text); }

.focusBtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.focusBtns .spacer{flex:1}

/* =========================================================
   SUMMARY PAGE
   ========================================================= */
.summaryPage{ margin-top: 14px; }
.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width: 860px){.summaryGrid{grid-template-columns:1fr}}
.summaryCard{
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 14px;
}
html[data-theme="light"] .summaryCard{ background: rgba(255,255,255,.92); }
.summaryCard h3{
  margin:0;
  font-size:13px;
  letter-spacing:.14em;
  color:rgba(238,240,244,.62);
  cursor:pointer;
  user-select:none;
}
html[data-theme="light"] .summaryCard h3{ color: rgba(31,35,40,.75); }
.miniDivider{height:1px;background:var(--line);margin:12px 0}
.summaryRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:rgba(238,240,244,.64);font-size:13px;}
html[data-theme="light"] .summaryRow{ color: var(--muted); }
.kpi{font-weight:850;color:rgba(255,255,255,.90)}
html[data-theme="light"] .kpi{ color: var(--text); font-weight:800; }
.summaryHint{margin-top:12px;font-size:12px;color:var(--muted)}
.focusPreview{display:flex;gap:10px;align-items:flex-start}
.focusMark{width:10px;height:10px;border-radius:999px;margin-top:6px;background: var(--accent);opacity:.7;box-shadow:0 0 0 6px rgba(215,176,122,.10);}
html[data-theme="light"] .focusMark{ box-shadow:none; opacity:.55; }
.focusTitle{font-weight:800;color:rgba(255,255,255,.92);margin:0}
html[data-theme="light"] .focusTitle{ color: var(--text); font-weight:750; }
.focusMeta{margin-top:4px;color:rgba(238,240,244,.62);font-size:13px}
html[data-theme="light"] .focusMeta{ color: var(--muted); }
</style>

<body>
<div class="wrap">
  <div class="card">

    <div class="topbar">
      <div class="brand" id="brandToggle" title="Toggle summary / list">
        <img src="espresso-icon.png" alt="ESPRESSO">
        <div class="title">
          <h2>ESPRESSO</h2>
          <div class="subtitle">the calm before the brainstorm</div>
        </div>
      </div>

      <div id="timerHeader" class="timerBadge"></div>

      <div class="status" id="saveStatus">
        <span class="dot"></span>
        Loading…
      </div>

      <div class="actionsTop">
        <button id="compactToggle" class="subtle iconTopBtn" type="button" title="Toggle compact mode">▤</button>
        <button id="themeToggle" class="subtle iconTopBtn" type="button">☀︎ / ☾</button>
        <button id="forceSaveBtn" class="accent iconTopBtn" type="button" title="Force save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        <button id="focusBtn" class="primary iconTopBtn" type="button" title="Focus mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></button>

      </div>
    </div>

    <div class="content">
      <div class="main">

        <div class="sectionHeaderWrap">

          <div id="projectMenu" class="projectMenu" aria-hidden="true">

              <button id="addProjectBtn" class="primary" type="button">Add</button>

  </div>
</div>

<div class="modalOverlay" id="linkOverlay" aria-hidden="true">
  <div class="modalInner">
    <div class="modalBox" role="dialog" aria-modal="true" aria-label="Dependencies">

          <button id="unlinkBtn" class="unlinkBtnIcon" type="button" title="Unlink">

<div class="focusOverlay" id="focusOverlay" aria-hidden="true">

            <span id="focusTimerHint" class="focusTimerHint" style="display:none;">Click to set estimate</span>

</div>

<script>
/* =========================================================
   HELPERS
   ========================================================= */
const $ = (id) => document.getElementById(id);
const qsa = (sel) => [...document.querySelectorAll(sel)];

function uid(){
  return (crypto.randomUUID
    ? crypto.randomUUID()
    : Math.random().toString(16).slice(2) + Date.now().toString(16));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
async function fetchWithTimeout(url, options={}, timeoutMs=5000){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, { ...options, signal: controller.signal });
  } finally { clearTimeout(t); }
}

/* =========================================================
   THEME TOGGLE
   ========================================================= */
const THEME_KEY = "espresso_theme_v1";
const COMPACT_KEY = "espresso_compact_v1";

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch{}
}
function initTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved) return applyTheme(saved);
  }catch{}
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(prefersDark ? "dark" : "light");
}
$("themeToggle").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
};

function applyCompact(compact){
  document.documentElement.setAttribute("data-compact", compact ? "true" : "false");
  try{ localStorage.setItem(COMPACT_KEY, compact ? "true" : "false"); }catch{}
}
function initCompact(){
  try{
    const saved = localStorage.getItem(COMPACT_KEY);
    if(saved === "true") return applyCompact(true);
  }catch{}
  applyCompact(false);
}
$("compactToggle").onclick = () => {
  const cur = document.documentElement.getAttribute("data-compact");
  applyCompact(cur !== "true");
};

/* =========================================================
   ICONS (strings)
   ========================================================= */
const ICONS = {
  done:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  pause: `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>`,
  play:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 6.5v11l10-5.5-10-5.5z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
  undo:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 1 1 0 12h-2"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>`,
  link:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h3a5 5 0 1 1 0 10h-3"/><path d="M9 17H6a5 5 0 1 1 0-10h3"/><path d="M8 12h8"/></svg>`,
  unlink:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h3a5 5 0 1 1 0 10h-3"/><path d="M9 17H6a5 5 0 1 1 0-10h3"/><path d="M8 12h8"/><path d="M4 4l16 16"/></svg>`,
  reset: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>`,
  pencil:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
  chevron:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
  subtask:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12h6"/><path d="M16 6h6"/><path d="M3 6h2v12h4"/><path d="M9 18h10"/></svg>`
};

/* Color palette for task tagging */
const TASK_COLORS = [
  null,  // no color (clear)
  "#ef4444", // red
  "#f97316", // orange
  "#eab308", // yellow
  "#22c55e", // green
  "#3b82f6", // blue
  "#8b5cf6", // purple
  "#ec4899"  // pink
];
$("focusTimerIconSlot").innerHTML = ICONS.clock;
$("focusTimerReset").innerHTML = ICONS.reset;
$("unlinkIconSlot").innerHTML = ICONS.unlink;
$("focusNotesIconSlot").innerHTML = ICONS.pencil;

/* =========================================================
   API + STORAGE
   ========================================================= */
const API_URL = "/api/state";
const FALLBACK_KEY = "espresso_state_fallback_projects_v1";
const TIMER_KEY = "espresso_timer_v3";

/* stable per-tab client id */
const CLIENT_ID = (() => {
  const KEY = "espresso_client_id_v1";
  let id = sessionStorage.getItem(KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(16).slice(2) + Date.now().toString(16)));
    sessionStorage.setItem(KEY, id);
  }
  return id;
})();

/* =========================================================
   DATE WINDOWS
   ========================================================= */
function startOfDayLocal(ts=Date.now()){
  const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime();
}
function startOfWeekMondayLocal(ts=Date.now()){
  const d = new Date(ts);
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d.getTime();
}

/* =========================================================
   PROJECTS STATE SHAPE
   ========================================================= */
const ALL_ID = "__all__";

function defaultProject(name){
  return {
    id: uid(),
    name: String(name||"PROJECT").trim() || "PROJECT",
    active: [],
    paused: [],
    done_today: [],
    done_week: [],
    meta_done: { day_start_ms: startOfDayLocal(), week_start_ms: startOfWeekMondayLocal() }
  };
}
function normalizeTask(t, projectId){
  const id = String(t?.id ?? uid());
  return {
    id,
    projectId: String(t?.projectId ?? projectId ?? ""),
    text: String(t?.text ?? ""),
    createdAt: Number(t?.createdAt ?? Date.now()),
    pausedReason: String(t?.pausedReason ?? ""),
    estimateMins: (Number.isFinite(Number(t?.estimateMins)) ? Math.max(0, Math.round(Number(t.estimateMins))) : 0),
    doneAt: (t?.doneAt ?? t?.completedAt ?? null),
    dependsOn: Array.isArray(t?.dependsOn) ? t.dependsOn.filter(Boolean).map(String) : [],
    notes: String(t?.notes ?? ""),
    color: (t?.color && TASK_COLORS.includes(t.color)) ? t.color : null,
    parentId: String(t?.parentId ?? ""),
    collapsed: Boolean(t?.collapsed)
  };
}
function taskKey(task){ return `${task.projectId}:${task.id}`; }
function parseTaskKey(k){
  const s = String(k||"");
  const i = s.indexOf(":");
  if(i < 0) return { projectId:"", id:s };
  return { projectId: s.slice(0,i), id: s.slice(i+1) };
}

/* =========================================================
   APP STATE
   ========================================================= */
const state = {
  projectId: null,
  view: "active",        // active | paused | done
  doneFilter: "today",   // today | week
  page: "list",          // list | summary
  data: {
    meta: { rev: 0, owner: CLIENT_ID, owner_updated_unix: 0 },
    projects: {},        // id -> project
    projectOrder: []     // flat order
  }
};

const editing = { id:null, kind:null, draft:"" };

const saveStatus = $("saveStatus");
const timerHeader = $("timerHeader");
const focusOverlay = $("focusOverlay");
const focusEstimateLine = $("focusEstimateLine");
const projectMenu = $("projectMenu");
const projectMenuList = $("projectMenuList");

let saveTimer = null;
let hasLoaded = false;
let lastSavedUnix = 0;

/* =========================================================
   STATUS
   ========================================================= */
function setStatus(msg){
  // FIX: Use textContent instead of innerHTML to prevent XSS
  const dot = document.createElement("span");
  dot.className = "dot";
  saveStatus.innerHTML = "";
  saveStatus.appendChild(dot);
  saveStatus.appendChild(document.createTextNode(msg));
}
function fmtSaved(unixSeconds){
  const d = unixSeconds ? new Date(unixSeconds * 1000) : new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mon = d.toLocaleString(undefined,{month:"short"});
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${dd} ${mon} ${hh}:${mm}`;
}
function setSavedStatusFromLast(){
  setStatus(`Saved ${fmtSaved(lastSavedUnix || null)}`);
}

/* =========================================================
   UI: ICON BUTTON
   ========================================================= */
function makeIconBtn(kind, onClick, {danger=false, title=""}={}){
  const b = document.createElement("button");
  b.type="button";
  b.className = "iconBtn" + (danger ? " danger" : "");
  b.innerHTML = ICONS[kind] || "";
  if(title) b.title = title;
  b.onclick = onClick;
  return b;
}

/* =========================================================
   PROJECT MENU open/close
   ========================================================= */
function closeProjectMenu(){
  projectMenu.classList.remove("on");
  projectMenu.setAttribute("aria-hidden","true");
}
function openProjectMenu(){
  projectMenu.classList.add("on");
  projectMenu.setAttribute("aria-hidden","false");
  $("newProjectName").focus();
}
$("sectionHeaderBtn").onclick = ()=> {
  projectMenu.classList.contains("on") ? closeProjectMenu() : openProjectMenu();
};
document.addEventListener("click",(e)=>{
  if(projectMenu.classList.contains("on")){
    const within = projectMenu.contains(e.target) || $("sectionHeaderBtn").contains(e.target);
    if(!within) closeProjectMenu();
  }
});

/* brand toggles summary/list */
$("brandToggle").onclick = ()=> setPage(state.page === "summary" ? "list" : "summary");
</script>

<script>
/* =========================================================
   NORMALISATION / MIGRATION
   ========================================================= */
function fixProject(p){
  p = p && typeof p==="object" ? p : {};
  const id = String(p.id || uid());
  const name = String(p.name || "PROJECT").trim() || "PROJECT";

  const meta_done = (p.meta_done && typeof p.meta_done==="object")
    ? {
        day_start_ms: Number(p.meta_done.day_start_ms || startOfDayLocal()),
        week_start_ms: Number(p.meta_done.week_start_ms || startOfWeekMondayLocal())
      }
    : { day_start_ms: startOfDayLocal(), week_start_ms: startOfWeekMondayLocal() };

  const doneOld = Array.isArray(p.done) ? p.done : [];
  const done_today = Array.isArray(p.done_today) ? p.done_today : [];
  const done_week  = Array.isArray(p.done_week) ? p.done_week : [];
  const active = Array.isArray(p.active) ? p.active : [];
  const paused = Array.isArray(p.paused) ? p.paused : [];

  const out = { id, name, active: [], paused: [], done_today: [], done_week: [], meta_done };

  if(doneOld.length && !done_today.length && !done_week.length){
    out.done_today = doneOld.slice();
    out.done_week  = doneOld.slice();
  }else{
    out.done_today = done_today;
    out.done_week  = done_week;
  }

  out.active = active;
  out.paused = paused;

const normArr = (arr)=>arr.map(t=>{
  const nt = normalizeTask(t, id);
  nt.projectId = id; // IMPORTANT: force container projectId
  return nt;
});

out.active = normArr(out.active);
out.paused = normArr(out.paused);
out.done_today = normArr(out.done_today);
out.done_week  = normArr(out.done_week);


  const ensureKeyDeps = (t)=>{
    t.dependsOn = Array.isArray(t.dependsOn) ? t.dependsOn.filter(Boolean).map(String) : [];
    t.dependsOn = t.dependsOn.map(k=>{
      return (String(k).includes(":")) ? String(k) : `${id}:${String(k)}`;
    });
  };
  [...out.active, ...out.paused, ...out.done_today, ...out.done_week].forEach(ensureKeyDeps);

  return out;
}

function legacyHasWorkPersonal(payload){
  return payload && typeof payload==="object" && payload.work && payload.personal && !payload.projects && !payload.projectOrder && !payload.projects_order;
}

function migrateLegacyToProjects(payload){
  const work = payload.work || {};
  const personal = payload.personal || {};

  const pWork = defaultProject("Work");  pWork.id = "work";
  const pPers = defaultProject("Personal"); pPers.id = "personal";

  pWork.active = Array.isArray(work.active) ? work.active : [];
  pWork.paused = Array.isArray(work.paused) ? work.paused : [];
  pWork.done_today = Array.isArray(work.done_today) ? work.done_today : [];
  pWork.done_week  = Array.isArray(work.done_week) ? work.done_week : [];
  pWork.meta_done = (work.meta_done && typeof work.meta_done==="object")
    ? { day_start_ms: Number(work.meta_done.day_start_ms||startOfDayLocal()), week_start_ms: Number(work.meta_done.week_start_ms||startOfWeekMondayLocal()) }
    : pWork.meta_done;

  pPers.active = Array.isArray(personal.active) ? personal.active : [];
  pPers.paused = Array.isArray(personal.paused) ? personal.paused : [];
  pPers.done_today = Array.isArray(personal.done_today) ? personal.done_today : [];
  pPers.done_week  = Array.isArray(personal.done_week) ? personal.done_week : [];
  pPers.meta_done = (personal.meta_done && typeof personal.meta_done==="object")
    ? { day_start_ms: Number(personal.meta_done.day_start_ms||startOfDayLocal()), week_start_ms: Number(personal.meta_done.week_start_ms||startOfWeekMondayLocal()) }
    : pPers.meta_done;

  const fix = (proj)=>{
    proj.active = proj.active.map(t=>normalizeTask(t, proj.id));
    proj.paused = proj.paused.map(t=>normalizeTask(t, proj.id));
    proj.done_today = proj.done_today.map(t=>normalizeTask(t, proj.id));
    proj.done_week  = proj.done_week.map(t=>normalizeTask(t, proj.id));
    const all = [...proj.active, ...proj.paused, ...proj.done_today, ...proj.done_week];
    for(const t of all){
      t.dependsOn = (t.dependsOn||[]).map(k => String(k).includes(":") ? String(k) : `${proj.id}:${String(k)}`);
    }
  };
  fix(pWork); fix(pPers);

  return {
    meta: payload.meta || { rev:0, owner:null, owner_updated_unix:0 },
    projects: { [pWork.id]: pWork, [pPers.id]: pPers },
    projectOrder: [pWork.id, pPers.id]
  };
}


function detectAndBreakCycles(projects){
  const allTasksMap = new Map();
  for(const pid of Object.keys(projects)){
    const proj = projects[pid];
    for(const t of [...proj.active, ...proj.paused, ...proj.done_today, ...proj.done_week]){
      allTasksMap.set(taskKey(t), t);
    }
  }

  // For each task, check if following its dependencies creates a cycle
  for(const [key, task] of allTasksMap){
    const visited = new Set();
    const stack = [...(task.dependsOn || [])];
    
    while(stack.length > 0){
      const depKey = stack.pop();
      if(depKey === key){
        // Cycle detected! Remove this dependency
        console.warn(`Cycle detected: ${key} -> ... -> ${key}. Breaking cycle.`);
        task.dependsOn = task.dependsOn.filter(d => d !== depKey);
        continue;
      }
      if(visited.has(depKey)) continue;
      visited.add(depKey);
      
      const depTask = allTasksMap.get(depKey);
      if(depTask && depTask.dependsOn){
        for(const d of depTask.dependsOn){
          if(!visited.has(d)) stack.push(d);
        }
      }
    }
  }
}


function fixState(payload){
  if(!payload || typeof payload !== "object") payload = {};

  // accept server schema (projects_order) and map to projectOrder
  if(Array.isArray(payload.projects_order) && !Array.isArray(payload.projectOrder)){
    payload.projectOrder = payload.projects_order.slice();
  }

  if(legacyHasWorkPersonal(payload)){
    payload = migrateLegacyToProjects(payload);
  }

  if(!payload.meta || typeof payload.meta!=="object"){
    payload.meta = { rev:0, owner:null, owner_updated_unix:0 };
  }
  payload.meta.rev = Number(payload.meta.rev || 0);
  payload.meta.owner = payload.meta.owner || null;
  payload.meta.owner_updated_unix = Number(payload.meta.owner_updated_unix || 0);

  if(!payload.projects || typeof payload.projects!=="object") payload.projects = {};
  if(!Array.isArray(payload.projectOrder)) payload.projectOrder = [];

  const fixed = {};
  for(const [pid, proj] of Object.entries(payload.projects)){
    const fp = fixProject({ ...proj, id: pid });
    fixed[fp.id] = fp;
  }
  payload.projects = fixed;
// HARD FIX: ensure every task stored in a project has matching task.projectId
for (const [pid, proj] of Object.entries(payload.projects)) {
  for (const t of [...proj.active, ...proj.paused, ...proj.done_today, ...proj.done_week]) {
    t.projectId = pid;
  }
}


  payload.projectOrder = payload.projectOrder.filter(pid => payload.projects[pid]);
  for(const pid of Object.keys(payload.projects)){
    if(!payload.projectOrder.includes(pid)) payload.projectOrder.push(pid);
  }

  if(!payload.projects.work){
    const w = fixProject({ ...defaultProject("Work"), id:"work", name:"Work" });
    payload.projects.work = w;
    if(!payload.projectOrder.includes("work")) payload.projectOrder.unshift("work");
  }
  if(!payload.projects.personal){
    const p = fixProject({ ...defaultProject("Personal"), id:"personal", name:"Personal" });
    payload.projects.personal = p;
    if(!payload.projectOrder.includes("personal")) payload.projectOrder.push("personal");
  }

  // FIX: Detect and break any cycles in dependencies on load
  detectAndBreakCycles(payload.projects);

  return payload;
}

/* =========================================================
   PROJECT ACCESS
   ========================================================= */
function getProject(pid){ return state.data.projects[pid] || null; }

function ensureCurrentProject(){
  if(!state.projectId){
    state.projectId = state.data.projectOrder[0] || "work";
  }
  if(state.projectId !== ALL_ID && !state.data.projects[state.projectId]){
    state.projectId = state.data.projectOrder[0] || "work";
  }
}

function currentProject(){
  ensureCurrentProject();
  if(state.projectId === ALL_ID) return null;
  return getProject(state.projectId);
}

/* =========================================================
   DONE BUCKET ROLLOVER
   ========================================================= */
function rolloverDoneBuckets(){
  const nowDay = startOfDayLocal();
  const nowWeek = startOfWeekMondayLocal();

  for(const pid of Object.keys(state.data.projects)){
    const proj = state.data.projects[pid];
    if(!proj.meta_done) proj.meta_done = { day_start_ms: nowDay, week_start_ms: nowWeek };

    if(proj.meta_done.day_start_ms !== nowDay){
      proj.done_today = [];
      proj.meta_done.day_start_ms = nowDay;
    }
    if(proj.meta_done.week_start_ms !== nowWeek){
      proj.done_week = [];
      proj.meta_done.week_start_ms = nowWeek;
    }
  }
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function makePayload(){
  // Don't increment rev here - let the server handle it
  // This prevents double-increment when client and server both bump rev
  const out = {
    meta: { ...state.data.meta, owner: CLIENT_ID },
    projects: state.data.projects,
    projectOrder: state.data.projectOrder,
    projects_order: state.data.projectOrder
  };
  return JSON.stringify(out);
}


function queueSave(){
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveNow({silent:true}).catch(()=>{}), 220);
}

async function saveNow({silent=false, force=false}={}){
  rolloverDoneBuckets();
  enforceDependenciesAllProjects();

  const payload = makePayload();
  localStorage.setItem(FALLBACK_KEY, payload);

  const url = force ? `${API_URL}?force=1` : API_URL;

  let res;
  try{
    res = await fetchWithTimeout(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: payload,
      cache:"no-store",
      keepalive:true
    }, 5000);
  }catch(e){
    setStatus(`SAVE FAILED (network): ${e?.name || "error"}`);
    throw e;
  }

  if(!res.ok){
    const msg = await res.json().catch(()=>({error:"Save failed"}));
    setStatus(`SAVE FAILED (${res.status}): ${msg.error || "Save failed"}`);
    throw new Error(msg.error || "Save failed");
  }

 const out = await res.json().catch(()=>null);
  
  // FIX: Update local rev from server response to stay in sync
  if(out && typeof out.rev === "number"){
    state.data.meta.rev = out.rev;
  }
  
  const ts = out?.saved_at_unix;
  lastSavedUnix = ts || lastSavedUnix || Math.floor(Date.now()/1000);

  if(!force) setSavedStatusFromLast();
  return true;
}

async function loadAll(){
  try{
    const res = await fetchWithTimeout(API_URL, {method:"GET", cache:"no-store"}, 5000);
    if(!res.ok) throw new Error("Bad response");
    const payload = await res.json();

    state.data = fixState(payload);
    state.data.meta.owner = CLIENT_ID;

    ensureCurrentProject();
    rolloverDoneBuckets();
    enforceDependenciesAllProjects();

    localStorage.setItem(FALLBACK_KEY, JSON.stringify(state.data));
    setStatus("Loaded");
    hasLoaded = true;
    return;
  }catch(e){
    setStatus(`Server not reachable (${e?.name || "error"}). Falling back…`);
  }

  const raw = localStorage.getItem(FALLBACK_KEY);
  if(raw){
    try{
      const payload = JSON.parse(raw);
      state.data = fixState(payload);
      state.data.meta.owner = CLIENT_ID;

      ensureCurrentProject();
      rolloverDoneBuckets();
      enforceDependenciesAllProjects();

      setStatus("Loaded locally");
      hasLoaded = true;
      return;
    }catch{}
  }

  state.data = fixState({meta:{rev:0,owner:CLIENT_ID,owner_updated_unix:0},projects:{},projectOrder:[]});
  ensureCurrentProject();
  rolloverDoneBuckets();
  enforceDependenciesAllProjects();
  setStatus("New list");
  hasLoaded = true;
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden" && hasLoaded){
    saveNow({silent:true}).catch(()=>{});
  }
});
</script>

<script>
/* =========================================================
   PROJECT CRUD + MENU

function addProject(name){
  const n = String(name||"").trim();
  if(!n) return;
  const p = defaultProject(n);
  state.data.projects[p.id] = fixProject(p);
  state.data.projectOrder.push(p.id);
  state.projectId = p.id;
  queueSave();
  renderAll();

function renameProject(pid){
  const p = getProject(pid);
  if(!p) return;
  const next = prompt("Rename project:", p.name);
  if(next===null) return;
  const n = String(next||"").trim();
  if(!n) return;
  p.name = n;
  queueSave();
  renderAll();
}
function deleteProject(pid){
  if(pid==="work" || pid==="personal"){
    alert("Work and Personal cannot be deleted.");
    return;
  }
  const p = getProject(pid);
  if(!p) return;
  if(!confirm(`Delete project "${p.name}" and ALL tasks inside it?`)) return;

  delete state.data.projects[pid];
  state.data.projectOrder = state.data.projectOrder.filter(x=>x!==pid);

  const deadPrefix = pid + ":";
  for(const proj of Object.values(state.data.projects)){
    for(const t of allTasks(proj)){
      if(Array.isArray(t.dependsOn)){
        t.dependsOn = t.dependsOn.filter(k => !String(k).startsWith(deadPrefix));
      }
    }
  }

  if(state.projectId === pid){
    state.projectId = state.data.projectOrder[0] || "work";
  }
  queueSave();
  renderAll();
}
